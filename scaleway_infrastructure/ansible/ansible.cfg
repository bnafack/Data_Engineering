# Run Ansible from this directory (run.sh does it for you).
# The inventory is NOT set here: run.sh passes -i inventories/<env>/hosts.yml
# so dev and prod can never be mixed by accident.
[defaults]
roles_path = roles
collections_path = .ansible/collections
retry_files_enabled = False
host_key_checking = True
forks = 5
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Secrets: the vault password file is chosen by run.sh, never set here.

[ssh_connection]
pipelining = True
# accept-new records the host key on first contact and refuses changed keys.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
