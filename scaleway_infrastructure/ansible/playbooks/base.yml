---
- name: Import the environment guard
  ansible.builtin.import_playbook: guard.yml

- name: Baseline (packages, time, SSH hardening, fail2ban, firewall)
  hosts: servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  max_fail_percentage: 0
  roles:
    - role: base
      tags: [base]
