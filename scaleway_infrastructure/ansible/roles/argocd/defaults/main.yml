---
# Off by default. Enable per environment in inventories/<env>/group_vars/all/main.yml.
argocd_enabled: false
# Exact release (was the latest when written). Upgrade: change it and re-run `./run.sh <env> argocd`.
argocd_version: "v3.6.2"
argocd_namespace: argocd
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
argocd_state_dir: /var/lib/argocd

# Optional "app of apps". Empty repo URL = skip. Private repos need credentials added in Argo CD (out of scope).
argocd_root_app_repo_url: ""
argocd_root_app_path: ""
argocd_root_app_target_revision: HEAD
argocd_root_app_name: root
