---
- name: Check inputs
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['app']
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - k3s_token | length >= 32
      - not (k3s_token | string).startswith('CHANGE_ME')
    fail_msg: >-
      k3s runs on the app group only, k3s_version must be exact (for example v1.37.2+k3s1),
      and vault_k3s_token must be a real secret of at least 32 characters.
    quiet: true
  no_log: true

- name: Create the k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the k3s configuration (before the install, so the first start uses it)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s

- name: Download the k3s install script of the pinned tag
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "/usr/local/share/k3s-install-{{ k3s_version | replace('+', '-') }}.sh"
    checksum: "{{ k3s_install_script_checksum or omit }}"
    owner: root
    group: root
    mode: "0755"

- name: Read the installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install or upgrade k3s to the pinned version
  ansible.builtin.command: "/usr/local/share/k3s-install-{{ k3s_version | replace('+', '-') }}.sh"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_SKIP_START: "true"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true
  notify: Restart k3s

- name: Open the pod and service CIDRs to the host (official k3s ufw guidance)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "k3s {{ item }}"
  loop:
    - "{{ k3s_pod_cidr }}"
    - "{{ k3s_service_cidr }}"
  when: k3s_manage_ufw | bool

- name: Enable and start k3s
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts before waiting for the node
  ansible.builtin.meta: flush_handlers

- name: Wait for the node to be Ready
  ansible.builtin.command: "k3s kubectl wait --for=condition=Ready nodes --all --timeout={{ k3s_ready_timeout }}"
  register: k3s_ready
  changed_when: false
  retries: 5
  delay: 10
  until: k3s_ready.rc == 0

- name: Check that 6443 is not allowed in the host firewall
  ansible.builtin.command: ufw show added
  register: k3s_ufw_rules
  changed_when: false
  check_mode: false
  failed_when: k3s_ufw_rules.stdout is search('6443')

- name: Create ~/.kube for the admin user
  ansible.builtin.file:
    path: "/home/{{ k3s_kubeconfig_user }}/.kube"
    state: directory
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0700"

- name: Install the kubeconfig for the admin user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ k3s_kubeconfig_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0600"

- name: Fetch the kubeconfig to the controller
  when: k3s_fetch_kubeconfig | bool
  tags: [kubeconfig]
  block:
    - name: Read the kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    - name: Check that the API server address is the local tunnel endpoint
      ansible.builtin.assert:
        that:
          - (k3s_kubeconfig.content | b64decode) is search('server: https://127.0.0.1:6443')
        fail_msg: "Unexpected server address in k3s.yaml; the fetched kubeconfig would not work through the SSH tunnel."
        quiet: true
      no_log: true

    - name: Create the local kubeconfig directory (git-ignored)
      ansible.builtin.file:
        path: "{{ k3s_fetch_dest }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the kubeconfig on the controller (mode 0600)
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode }}"
        dest: "{{ k3s_fetch_dest }}/{{ inventory_hostname }}.kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: How to use the fetched kubeconfig
      ansible.builtin.debug:
        msg:
          - "Open the tunnel: ssh -N -L 6443:127.0.0.1:6443 {{ ansible_ssh_common_args | default('') }} {{ ansible_user }}@{{ ansible_host }}"
          - "Then: KUBECONFIG={{ k3s_fetch_dest }}/{{ inventory_hostname }}.kubeconfig kubectl get nodes"
