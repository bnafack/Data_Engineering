---
# UNVERIFIED: the netplan layout below follows the documented model (a Private Network is a VLAN on the
# server NIC, address from IPAM/DHCP). The Scaleway page could not be checked while writing this role.
# Opt-in: nothing happens until network_configure is true (set it in inventories/<env>/group_vars/all/main.yml).
network_configure: false

# Parent NIC of the VLAN. Empty = interface of the default (public) route. CHECK with `ip -br link`.
network_parent_interface: ""
# VLAN ID of this server in the Private Network (Terraform outputs *_server_private_vlan, host var private_vlan).
network_vlan_id: "{{ private_vlan | default('') }}"
network_vlan_interface: "{{ network_parent_interface_effective }}.{{ network_vlan_id }}"
network_parent_interface_effective: "{{ network_parent_interface | default('', true) or ansible_facts['default_ipv4']['interface'] }}"

# IPv4 the server is expected to get (Terraform output *_server_private_ip, host var private_ip).
network_expected_ip: "{{ private_ip | default('') }}"
# DHCP (IPAM) is the default. Static fallback: "<ip>/<prefix>", for example "172.16.64.2/22".
network_use_dhcp: true
network_static_address: ""

# The Private Network pushes a default route when the Public Gateway has push_default_route enabled.
# We keep the PUBLIC default route (apt, Docker, k3s downloads need no NAT) and ignore routes/DNS from DHCP.
network_dhcp_use_routes: false
network_dhcp_use_dns: false
network_mtu: ""

network_netplan_file: /etc/netplan/60-private-network.yaml
