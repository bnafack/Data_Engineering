<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 800" width="1520" height="800" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Proposal 5 – Single Dedibox VPS, self-hosted services, LWS DNS">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f0599"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="1520" height="800" fill="#f8fafc"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Proposal 5 – Single Dedibox VPS · self-hosted services · LWS DNS</text>

  <!-- Scaleway boundary -->
  <rect x="430" y="70" width="910" height="640" rx="16" fill="#faf5ff" stroke="#4f0599" stroke-width="2"/>
  <rect x="430" y="70" width="910" height="34" rx="16" fill="#4f0599"/>
  <rect x="430" y="88" width="910" height="16" fill="#4f0599"/>
  <text x="450" y="93" font-size="15" font-weight="700" fill="#ffffff">☁️ Scaleway – Dedibox VPS + Cloud services (fr-par)</text>

  <!-- LWS DNS (external provider) -->
  <g filter="url(#sh)"><rect x="215" y="120" width="180" height="80" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/></g>
  <text x="305" y="146" font-size="15" font-weight="700" text-anchor="middle" fill="#155e75">🌍 LWS DNS</text>
  <text x="305" y="165" font-size="11" text-anchor="middle" fill="#0e7490">example.com / app.example.com</text>
  <text x="305" y="182" font-size="11" text-anchor="middle" fill="#0e7490">A record → VPS public IP</text>

  <!-- Users -->
  <g filter="url(#sh)"><rect x="30" y="290" width="130" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="95" y="320" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">🌐 Users</text>
  <text x="95" y="340" font-size="12" text-anchor="middle" fill="#475569">Internet</text>

  <!-- Admin -->
  <g filter="url(#sh)"><rect x="30" y="415" width="150" height="80" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/></g>
  <text x="105" y="440" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">👤 Admin / Ops</text>
  <text x="105" y="458" font-size="11" text-anchor="middle" fill="#475569">SSH key only (no password)</text>
  <text x="105" y="473" font-size="11" text-anchor="middle" fill="#475569">fixed admin IPs</text>
  <text x="105" y="488" font-size="11" text-anchor="middle" fill="#475569">DB via SSH tunnel</text>

  <!-- CI/CD -->
  <g filter="url(#sh)"><rect x="30" y="560" width="150" height="75" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="105" y="585" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">🔧 CI/CD</text>
  <text x="105" y="603" font-size="11" text-anchor="middle" fill="#475569">build → push to Registry</text>
  <text x="105" y="619" font-size="11" text-anchor="middle" fill="#475569">deploy over SSH</text>

  <!-- Git -->
  <g filter="url(#sh)"><rect x="30" y="690" width="150" height="55" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="105" y="714" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">📁 Git Repo</text>
  <text x="105" y="732" font-size="11" text-anchor="middle" fill="#475569">code + docker-compose.yml</text>

  <!-- VPS -->
  <g filter="url(#sh)"><rect x="460" y="200" width="560" height="480" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/></g>
  <text x="740" y="224" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">🖥️ Dedibox VPS-START-2-XXL · public IPv4</text>
  <text x="740" y="243" font-size="12" text-anchor="middle" fill="#1e40af">16 cores · 32 GB RAM · 320 GB SSD · 1 Gbps · €89.99/mo</text>

  <!-- Firewall -->
  <rect x="475" y="255" width="530" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="277" font-size="12" font-weight="600" text-anchor="middle" fill="#7f1d1d">🔥 Firewall (nftables/ufw) · 80/443 open · 22 admin IPs only · fail2ban</text>

  <!-- Reverse proxy -->
  <rect x="475" y="298" width="530" height="48" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="740" y="318" font-size="13" font-weight="700" text-anchor="middle" fill="#9a3412">🔀 Reverse proxy (Traefik / Caddy) – only public entry point</text>
  <text x="740" y="336" font-size="11" text-anchor="middle" fill="#9a3412">Let's Encrypt TLS · rate limiting · security headers</text>

  <!-- Docker area -->
  <rect x="475" y="356" width="530" height="312" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-dasharray="6 4"/>
  <text x="490" y="376" font-size="12" font-weight="700" fill="#1e3a8a">🐳 Docker – internal network (no ports published to the internet)</text>

  <!-- Row 1 -->
  <rect x="490" y="386" width="250" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="502" y="406" font-size="13" font-weight="700" fill="#1e3a8a">🐳 App / API</text>
  <text x="502" y="423" font-size="11" fill="#1e40af">3 × 4 GB containers</text>
  <text x="502" y="436" font-size="10" fill="#1e40af">calls Generative APIs, S3, Dedibox</text>

  <rect x="750" y="386" width="240" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="762" y="406" font-size="13" font-weight="700" fill="#1e3a8a">🐳 Frontend</text>
  <text x="762" y="423" font-size="11" fill="#1e40af">static / SSR container</text>

  <!-- Row 2 -->
  <rect x="490" y="450" width="250" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="502" y="470" font-size="13" font-weight="700" fill="#14532d">🐘 PostgreSQL (self-hosted)</text>
  <text x="502" y="487" font-size="11" fill="#166534">volume on local SSD · not exposed</text>
  <text x="502" y="500" font-size="10" fill="#166534">only reachable on Docker network</text>

  <rect x="750" y="450" width="240" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="762" y="470" font-size="13" font-weight="700" fill="#7f1d1d">⚡ Redis (self-hosted)</text>
  <text x="762" y="487" font-size="11" fill="#991b1b">password + internal only</text>

  <!-- Row 3 -->
  <rect x="490" y="514" width="250" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="502" y="534" font-size="13" font-weight="700" fill="#334155">⚙️ Workers / cron</text>
  <text x="502" y="551" font-size="11" fill="#475569">background jobs, queues</text>

  <rect x="750" y="514" width="240" height="56" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="762" y="534" font-size="13" font-weight="700" fill="#6b21a8">💾 Backup job</text>
  <text x="762" y="551" font-size="11" fill="#7e22ce">pgBackRest / pg_dump → S3</text>
  <text x="762" y="564" font-size="10" fill="#7e22ce">nightly + WAL · restore tested</text>

  <!-- Row 4 -->
  <rect x="490" y="578" width="250" height="56" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="502" y="598" font-size="13" font-weight="700" fill="#713f12">📊 Monitoring</text>
  <text x="502" y="615" font-size="11" fill="#854d0e">Prometheus + Grafana / Netdata</text>
  <text x="502" y="628" font-size="10" fill="#854d0e">or ship logs to Cockpit</text>

  <rect x="750" y="578" width="240" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="762" y="598" font-size="13" font-weight="700" fill="#334155">🧰 Docker Compose</text>
  <text x="762" y="615" font-size="11" fill="#475569">compose pull &amp;&amp; up -d</text>
  <text x="762" y="628" font-size="10" fill="#475569">unattended-upgrades for OS patches</text>

  <text x="490" y="660" font-size="11" fill="#1e40af">Local SSD 320 GB: OS · Docker images · PostgreSQL data · Redis AOF</text>

  <!-- Right column: Scaleway services -->
  <g filter="url(#sh)"><rect x="1080" y="210" width="240" height="65" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/></g>
  <text x="1200" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">📦 Container Registry</text>
  <text x="1200" y="256" font-size="12" text-anchor="middle" fill="#0369a1">private namespace · images</text>

  <g filter="url(#sh)"><rect x="1080" y="300" width="240" height="75" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g>
  <text x="1200" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#6b21a8">🗂️ Object Storage (S3)</text>
  <text x="1200" y="345" font-size="12" text-anchor="middle" fill="#7e22ce">documents bucket</text>
  <text x="1200" y="362" font-size="12" text-anchor="middle" fill="#7e22ce">backups bucket (versioned)</text>

  <g filter="url(#sh)"><rect x="1080" y="400" width="240" height="90" rx="10" fill="#ede9fe" stroke="#4f0599" stroke-width="2"/></g>
  <text x="1200" y="426" font-size="15" font-weight="700" text-anchor="middle" fill="#4f0599">🧠 Generative APIs</text>
  <text x="1200" y="446" font-size="12" text-anchor="middle" fill="#4f0599">Mistral models</text>
  <text x="1200" y="464" font-size="12" text-anchor="middle" fill="#4f0599">OpenAI-compatible · IAM API key</text>

  <g filter="url(#sh)"><rect x="1080" y="515" width="240" height="70" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/></g>
  <text x="1200" y="543" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">🗄️ Dedibox server</text>
  <text x="1200" y="563" font-size="12" text-anchor="middle" fill="#334155">Cartography service</text>

  <!-- Risk notes -->
  <rect x="1080" y="600" width="245" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="1092" y="620" font-size="12" font-weight="700" fill="#92400e">⚠️ Trade-offs</text>
  <text x="1092" y="637" font-size="10.5" fill="#78350f">• Single server = single point of failure</text>
  <text x="1092" y="653" font-size="10.5" fill="#78350f">• No WAF: firewall + fail2ban + proxy limits</text>
  <text x="1092" y="669" font-size="10.5" fill="#78350f">• You run DB backups, upgrades, patching</text>
  <text x="1092" y="685" font-size="10.5" fill="#78350f">• SSH exposed: keys only, IP-restricted</text>

  <!-- Arrows -->
  <!-- DNS lookup -->
  <path d="M95 290 V160 H213" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <path d="M395 160 H600 V198" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <!-- Users HTTPS -->
  <line x1="160" y1="322" x2="473" y2="322" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrO)"/>
  <!-- Admin SSH -->
  <path d="M180 455 H448 V272 H473" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <!-- CI deploy -->
  <path d="M180 597 H473" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <line x1="105" y1="690" x2="105" y2="637" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <!-- VPS <-> Scaleway services -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="1078" y1="242" x2="1022" y2="242"/>
    <line x1="1022" y1="337" x2="1078" y2="337"/>
    <line x1="1022" y1="550" x2="1078" y2="550"/>
  </g>
  <line x1="1022" y1="445" x2="1078" y2="445" stroke="#4f0599" stroke-width="2.5" marker-end="url(#arrP)"/>

  <!-- Labels -->
  <g font-size="11" fill="#334155">
    <text x="102" y="230" fill="#0e7490">DNS lookup</text>
    <text x="445" y="152" fill="#0e7490">resolves to VPS IP</text>
    <text x="200" y="314" fill="#c2410c" font-weight="600">HTTPS :443 (and :80 → redirect)</text>
    <text x="196" y="447" fill="#b91c1c" font-weight="600">SSH :22 (key + IP allowlist)</text>
    <text x="196" y="589">deploy (SSH: compose pull / up)</text>
    <text x="113" y="668">trigger</text>
    <text x="1026" y="234" font-size="10">pull</text>
    <text x="1026" y="329" font-size="10">files</text>
    <text x="1026" y="352" font-size="10">backups</text>
    <text x="1026" y="437" font-size="10" fill="#4f0599" font-weight="600">AI</text>
    <text x="1026" y="542" font-size="10">HTTPS</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="768" width="14" height="14" fill="#faf5ff" stroke="#4f0599"/><text x="50" y="780">Scaleway</text>
    <rect x="130" y="768" width="14" height="14" fill="#ecfeff" stroke="#0891b2"/><text x="150" y="780">LWS DNS</text>
    <rect x="235" y="768" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/><text x="255" y="780">VPS / Docker</text>
    <rect x="355" y="768" width="14" height="14" fill="#ffedd5" stroke="#ea580c"/><text x="375" y="780">Public entry (443)</text>
    <rect x="495" y="768" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/><text x="515" y="780">Firewall / SSH</text>
    <rect x="625" y="768" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/><text x="645" y="780">Self-hosted DB</text>
    <rect x="755" y="768" width="14" height="14" fill="#f3e8ff" stroke="#9333ea"/><text x="775" y="780">Storage / backups</text>
    <text x="930" y="780" font-weight="600">Est. cost: VPS €89.99/mo + Registry/S3 usage + AI tokens</text>
  </g>
</svg>
