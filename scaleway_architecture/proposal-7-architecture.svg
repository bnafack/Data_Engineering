  <path d="M903 531 H878 V503 H842" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrY)"/>
  <!-- Gateway to Generative APIs -->
  <path d="M1110 476 H1140 V290 H1153" stroke="#4f0599" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>
  <!-- Gateway to AWS SES and AWS SMS -->
  <path d="M1110 492 H1152 V400 H1383" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>
  <path d="M1110 515 H1383" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>
  <!-- Key Manager encrypts Secret Manager; app server reads secrets -->
  <line x1="357" y1="152" x2="413" y2="152" stroke="#db2777" stroke-width="2" marker-end="url(#arrK)"/>
  <path d="M485 187 V300 H588" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-start="url(#arrK)"/>

  <!-- Labels -->
  <g font-size="11" fill="#334155">
