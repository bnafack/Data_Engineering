    <text x="830" y="205">documents</text>
    <text x="190" y="555">SSH :61000 → bastion</text>
    <text x="1200" y="623">patching</text>
    <text x="1190" y="394" fill="#b45309" font-weight="600">emails (HTTPS)</text>
    <text x="1190" y="509" fill="#b45309" font-weight="600">SMS (HTTPS)</text>
    <text x="1160" y="346" font-size="10" fill="#4f0599" font-weight="600">AI calls (HTTPS)</text>
    <text x="360" y="146" font-size="9" fill="#9d174d" font-weight="600">encrypts</text>
    <text x="492" y="255" font-size="10" fill="#9d174d" font-weight="600">reads secrets</text>
  </g>
  <text x="230" y="706" font-size="11" fill="#334155">GitOps sync</text>

