<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 800" width="1700" height="800" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Proposal 7 – Elastic Metal app server and Elastic Metal cartography server in private network, no Redis, AWS SES for email marketing, AWS SMS, Scaleway Secret Manager and Key Manager">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f0599"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="1700" height="800" fill="#f8fafc"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Proposal 7 – Elastic Metal app + cartography (private) · AWS SES + SMS · Key Manager · no Redis</text>

  <!-- Scaleway cloud boundary -->
  <rect x="190" y="70" width="1150" height="650" rx="16" fill="#faf5ff" stroke="#4f0599" stroke-width="2"/>
  <rect x="190" y="70" width="1150" height="34" rx="16" fill="#4f0599"/>
  <rect x="190" y="88" width="1150" height="16" fill="#4f0599"/>
  <text x="210" y="93" font-size="15" font-weight="700" fill="#ffffff">☁️ Scaleway Cloud – Region fr-par (PAR 1)</text>

  <!-- VPC -->
  <rect x="570" y="200" width="560" height="400" rx="14" fill="#eef6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="585" y="590" font-size="14" font-weight="700" fill="#1d4ed8">VPC – Private Network (no public IP on the servers)</text>

  <!-- Users -->
  <g filter="url(#sh)"><rect x="30" y="335" width="130" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="95" y="365" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">🌐 Users</text>
  <text x="95" y="385" font-size="12" text-anchor="middle" fill="#475569">Internet</text>

  <!-- Admin -->
  <g filter="url(#sh)"><rect x="30" y="530" width="140" height="65" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="100" y="557" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">👤 Admin / Ops</text>
  <text x="100" y="576" font-size="11" text-anchor="middle" fill="#475569">SSH key + IP allowlist</text>

  <!-- Git -->
  <g filter="url(#sh)"><rect x="30" y="640" width="140" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="100" y="666" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">📁 Git Repo</text>
  <text x="100" y="685" font-size="12" text-anchor="middle" fill="#475569">Deploy manifests</text>

  <!-- Key Manager -->
  <g filter="url(#sh)"><rect x="215" y="120" width="140" height="65" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/></g>
  <text x="285" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#9d174d">🗝️ Key Manager</text>
  <text x="285" y="162" font-size="10.5" text-anchor="middle" fill="#9d174d">encryption keys</text>
  <text x="285" y="176" font-size="10.5" text-anchor="middle" fill="#9d174d">rotation · audit</text>

  <!-- Secret Manager -->
  <g filter="url(#sh)"><rect x="415" y="120" width="140" height="65" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/></g>
  <text x="485" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#9d174d">🔑 Secret Manager</text>
  <text x="485" y="162" font-size="10.5" text-anchor="middle" fill="#9d174d">DB · API · AWS keys</text>
  <text x="485" y="176" font-size="10.5" text-anchor="middle" fill="#9d174d">encrypted with a key</text>

  <!-- WAF -->
  <g filter="url(#sh)"><rect x="215" y="335" width="140" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/></g>
  <text x="285" y="365" font-size="15" font-weight="600" text-anchor="middle" fill="#9a3412">🛡️ WAF</text>
  <text x="285" y="385" font-size="12" text-anchor="middle" fill="#9a3412">Protection on LB</text>

  <!-- Network LB -->
  <g filter="url(#sh)"><rect x="385" y="330" width="150" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/></g>
  <text x="460" y="357" font-size="15" font-weight="600" text-anchor="middle" fill="#9a3412">⚖️ Network LB</text>
  <text x="460" y="377" font-size="12" text-anchor="middle" fill="#9a3412">L4 / TCP</text>
  <text x="460" y="395" font-size="12" text-anchor="middle" fill="#9a3412">Public IP</text>

  <!-- Container Registry -->
  <g filter="url(#sh)"><rect x="590" y="120" width="180" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/></g>
  <text x="680" y="145" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">📦 Container Registry</text>
  <text x="680" y="165" font-size="12" text-anchor="middle" fill="#0369a1">Docker images</text>

  <!-- Object Storage -->
  <g filter="url(#sh)"><rect x="820" y="120" width="190" height="60" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/></g>
  <text x="915" y="145" font-size="15" font-weight="700" text-anchor="middle" fill="#6b21a8">🗂️ Object Storage (S3)</text>
  <text x="915" y="165" font-size="12" text-anchor="middle" fill="#7e22ce">documents + backups</text>

  <!-- App server (Elastic Metal) -->
  <g filter="url(#sh)"><rect x="590" y="250" width="250" height="260" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/></g>
  <text x="715" y="273" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">🖥️ Elastic Metal EM-A410X-SSD</text>
  <text x="715" y="290" font-size="11" text-anchor="middle" fill="#1e40af">App server · Xeon E5-1650 · 6C/12T · 64 GB</text>
  <rect x="605" y="302" width="220" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="715" y="324" font-size="12" text-anchor="middle" fill="#1e3a8a">🐳 Docker – app containers (3 × 4 GB)</text>
  <rect x="605" y="342" width="220" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="715" y="364" font-size="12" text-anchor="middle" fill="#1e3a8a">🔄 Argo CD (k3s)</text>
  <rect x="605" y="382" width="220" height="50" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="715" y="402" font-size="12" font-weight="600" text-anchor="middle" fill="#6b21a8">💽 2 × 1 TB SSD · RAID 1 (mdadm)</text>
  <text x="715" y="420" font-size="10" text-anchor="middle" fill="#7e22ce">OS · images · volumes (local, not replicated)</text>
  <text x="715" y="454" font-size="11" text-anchor="middle" fill="#1e40af">Private IP only (Private Network)</text>
  <text x="715" y="472" font-size="10" text-anchor="middle" fill="#b45309">to verify: Private Network + LB backend</text>
  <text x="715" y="490" font-size="10" text-anchor="middle" fill="#1e40af">€54.99 / month</text>

  <!-- PostgreSQL -->
  <g filter="url(#sh)"><rect x="880" y="230" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g>
  <text x="995" y="253" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">🐘 Managed PostgreSQL</text>
  <text x="995" y="272" font-size="12" text-anchor="middle" fill="#166534">Block storage – 15k IOPS</text>
  <text x="995" y="289" font-size="12" text-anchor="middle" fill="#166534">Automatic backups</text>
  <text x="995" y="304" font-size="11" text-anchor="middle" fill="#166534">Private endpoint :5432</text>

  <!-- Cartography server (Elastic Metal) -->
  <g filter="url(#sh)"><rect x="880" y="330" width="230" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/></g>
  <text x="995" y="352" font-size="13" font-weight="700" text-anchor="middle" fill="#312e81">🗺️ Elastic Metal EM-B420E-NVMe</text>
  <text x="995" y="370" font-size="11" text-anchor="middle" fill="#3730a3">Cartography service</text>
  <text x="995" y="386" font-size="10.5" text-anchor="middle" fill="#3730a3">EPYC 7272 · 12C/24T · 128 GB</text>
  <text x="995" y="401" font-size="10.5" text-anchor="middle" fill="#3730a3">2 × 1 TB NVMe · 10 Gbps private</text>
  <text x="995" y="416" font-size="10.5" text-anchor="middle" fill="#3730a3">Private IP only · SSH via bastion</text>
  <text x="995" y="436" font-size="10.5" font-weight="600" text-anchor="middle" fill="#312e81">€159.99 + €19.99 Private Net 10G</text>

  <!-- Public Gateway + Bastion -->
  <g filter="url(#sh)"><rect x="880" y="470" width="230" height="95" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/></g>
  <text x="995" y="492" font-size="15" font-weight="700" text-anchor="middle" fill="#713f12">🚪 Public Gateway</text>
  <text x="995" y="510" font-size="12" text-anchor="middle" fill="#854d0e">NAT – outbound (patching, AI, AWS)</text>
  <rect x="905" y="525" width="180" height="28" rx="6" fill="#ffffff" stroke="#ca8a04"/>
  <text x="995" y="544" font-size="12" font-weight="700" text-anchor="middle" fill="#854d0e">🔐 SSH Bastion :61000</text>

  <!-- Generative APIs -->
  <g filter="url(#sh)"><rect x="1155" y="225" width="170" height="105" rx="10" fill="#ede9fe" stroke="#4f0599" stroke-width="2"/></g>
  <text x="1240" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#4f0599">🧠 Generative APIs</text>
  <text x="1240" y="270" font-size="12" text-anchor="middle" fill="#4f0599">Mistral models</text>
  <text x="1240" y="288" font-size="12" text-anchor="middle" fill="#4f0599">OpenAI-compatible API</text>
  <text x="1240" y="306" font-size="12" text-anchor="middle" fill="#4f0599">IAM API key · EU hosted</text>

  <!-- Alternative cartography server (cheaper) -->
  <rect x="600" y="622" width="510" height="80" rx="10" fill="#ffffff" stroke="#4338ca" stroke-dasharray="5 4"/>
  <text x="614" y="642" font-size="11" font-weight="700" fill="#312e81">Alternative cartography server (cheaper): EM-B212X-SSD</text>
  <text x="614" y="660" font-size="10.5" fill="#3730a3">2 × Xeon E5 v4 · 8C/16T · 256 GB · 2 × 1 TB SSD · 1 Gbps private</text>
  <text x="614" y="678" font-size="10.5" font-weight="600" fill="#312e81">€115.99 + €9.99 Private Net = €125.98 / month</text>
  <text x="614" y="694" font-size="10" fill="#3730a3">replaces EM-B420E-NVMe (€179.98 / month)</text>

  <!-- AWS (outside Scaleway) -->
  <rect x="1365" y="325" width="320" height="255" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1380" y="347" font-size="14" font-weight="700" fill="#b45309">☁️ AWS (outside Scaleway)</text>

  <g filter="url(#sh)"><rect x="1385" y="360" width="280" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/></g>
  <text x="1525" y="383" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">✉️ AWS SES</text>
  <text x="1525" y="402" font-size="11.5" font-weight="600" text-anchor="middle" fill="#92400e">Email marketing</text>
  <text x="1525" y="419" font-size="10.5" text-anchor="middle" fill="#b45309">campaigns · API / SMTP over TLS</text>
  <text x="1525" y="433" font-size="10.5" text-anchor="middle" fill="#b45309">DKIM · SPF · DMARC on your domain</text>

  <g filter="url(#sh)"><rect x="1385" y="475" width="280" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/></g>
  <text x="1525" y="498" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">📱 AWS SMS</text>
  <text x="1525" y="517" font-size="11.5" font-weight="600" text-anchor="middle" fill="#92400e">SMS messages</text>
  <text x="1525" y="534" font-size="10.5" text-anchor="middle" fill="#b45309">End User Messaging SMS · API over TLS</text>
  <text x="1525" y="548" font-size="10.5" text-anchor="middle" fill="#b45309">origination ID · opt-out handling</text>

  <!-- OS patch repos (internet) -->
  <g filter="url(#sh)"><rect x="1370" y="595" width="310" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="1525" y="621" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">🩹 OS Patch Repos</text>
  <text x="1525" y="639" font-size="11" text-anchor="middle" fill="#475569">apt / Docker Hub (Internet)</text>

  <!-- Trade-offs note -->
  <rect x="215" y="580" width="340" height="98" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="227" y="598" font-size="12" font-weight="700" fill="#92400e">⚠️ Trade-offs</text>
  <text x="227" y="614" font-size="10.5" fill="#78350f">• Each server is a single point of failure (hours to repair)</text>
  <text x="227" y="629" font-size="10.5" fill="#78350f">• No Redis: use PostgreSQL / in-app cache</text>
  <text x="227" y="644" font-size="10.5" fill="#78350f">• Local disks not replicated: back up map data to S3</text>
  <text x="227" y="659" font-size="10.5" fill="#78350f">• Optional: 2nd app server behind the NLB</text>
  <text x="227" y="674" font-size="10.5" fill="#78350f">• AWS SES / SMS: data leaves Scaleway (GDPR, DPA with AWS)</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="160" y1="370" x2="213" y2="370"/>
    <line x1="355" y1="370" x2="383" y2="370"/>
    <line x1="535" y1="370" x2="588" y2="370"/>
    <line x1="680" y1="250" x2="680" y2="182"/>
